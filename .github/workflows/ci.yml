name: Python quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-312.txt

      - name: Check PEP 8 and documentation style
        run: python scripts/check_style.py

      - name: Compile source files
        run: python -m compileall -q .

      - name: Install runtime dependencies
        run: python -m pip install -r requirements-312.txt

      - name: Run unit tests
        env:
          REPORT_QUEUE_ENABLED: "0"
          VISUAL_SIMILARITY_ENABLED: "0"
        run: python -m unittest discover -s tests -v
